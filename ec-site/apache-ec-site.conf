<VirtualHost *:80>
    ServerName ec-site.local

    # Fronts gunicorn (127.0.0.1:8000, not exposed outside this container)
    # purely to look and log like a production deployment -- the app code
    # behind it (SSRF, Via leak, gopher handling) is unchanged either way.
    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:8000/
    ProxyPassReverse / http://127.0.0.1:8000/

    # gunicorn's own "Server: gunicorn" would otherwise leak straight
    # through the proxy -- overwrite it so the front end looks like the
    # Apache it actually is from the outside.
    Header always set Server "Apache/2.4.65 (Ubuntu)"

    CustomLog /var/log/apache2/access.log combined
    ErrorLog /var/log/apache2/error.log
</VirtualHost>
