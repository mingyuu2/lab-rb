# Intentionally insecure config for a security training lab:
# no requirepass, protected-mode disabled, bound on all interfaces.
bind 0.0.0.0
protected-mode no
port 6379
dir /data
logfile "/var/log/redis/redis.log"
daemonize no

# Redis 7+ blocks `CONFIG SET dir`/`CONFIG SET dbfilename` (used by the
# classic gopher-SSRF-to-cron technique this lab reproduces) unless this is
# enabled. It can only be set at startup, not via CONFIG SET at runtime.
enable-protected-configs yes
