<VirtualHost *:80>
    ServerName ec-site.local
    # ServerAlias 192.0.2.10   # VM IP로 접속할 거면 IP 대신 이 줄을 켜서 맞추세요

    # gunicorn(127.0.0.1:8000, loopback 전용)을 리버스 프록시로 앞단에서 받음.
    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:8000/
    ProxyPassReverse / http://127.0.0.1:8000/

    # gunicorn 자신의 "Server: gunicorn/x.x" 헤더가 프록시를 그대로 통과해
    # 뒤에 Python 앱이 있다는 걸 흘리지 않도록 덮어씀.
    Header always set Server "Apache"

    CustomLog /var/log/apache2/access.log combined
    ErrorLog /var/log/apache2/error.log
</VirtualHost>
