{% extends "base.html" %}
{% from "components.html" import heading %}
{% block title %}会員情報の変更 — Nova Shop{% endblock %}
{% block content %}
  {{ heading('ACCOUNT DETAILS', '会員情報の変更') }}<div class="account-layout">
{% include "account_nav.html" %}
<div class="account-content">
{% if error %}
<p class="form-error" role="alert">{{ error }}</p>
{% endif %}
<form method="post" class="card form-panel form-stack">
<div>
<label for="nickname" class="field-label">ニックネーム</label>
<input id="nickname" type="text" name="nickname" value="{{ nickname or '' }}" maxlength="30" autocomplete="nickname" class="input-field" placeholder="ニックネーム">
</div>
<div>
<label for="new-password" class="field-label">新しいパスワード（変更する場合のみ）</label>
<input id="new-password" type="password" name="password" autocomplete="new-password" class="input-field" placeholder="変更しない場合は空欄">
</div>
<button type="submit" class="btn-solid w-full">保存する {{ icon('arrow') }}</button>
</form>
</div>
</div>
{% endblock %}
