{% extends "base.html" %}
{% block title %}{{ product.name }} — Nova Shop{% endblock %}
{% block content %}
  <div class="grid grid-cols-1 gap-10 md:grid-cols-2">
    <img src="{{ url_for('product_image', url=product.image_url) }}" alt="{{ product.name }}" class="card w-full object-cover">
    <div>
      <p class="text-sm text-[#9CA3AF]">{{ product.category }}</p>
      <h1 class="mt-1 text-2xl font-semibold">{{ product.name }}</h1>
      <p class="mt-3 text-[#374151]">{{ product.description }}</p>
      <p class="mt-4 text-xl font-semibold text-accent">¥{{ "{:,}".format(product.price) }}</p>

      <form action="{{ url_for('cart_add') }}" method="post" class="mt-6 flex items-center gap-3">
        <input type="hidden" name="product_id" value="{{ product.id }}">
        <input type="number" name="qty" value="1" min="1" class="input-field w-20">
        <button type="submit" class="btn-solid">カートに入れる</button>
      </form>
    </div>
  </div>
{% endblock %}
