{% extends "base.html" %}
{% block title %}マイページ — Nova Shop{% endblock %}
{% block content %}
  <h1 class="mb-6 text-2xl font-semibold">マイページ</h1>
  <p class="mb-6 text-sm text-[#374151]">{{ session.get('email') }} 様、ようこそ。</p>

  <div class="card max-w-md p-6">
    <h2 class="mb-4 text-sm font-semibold text-[#111827]">プロフィール画像URLの登録</h2>
    {% if error %}
      <p class="mb-4 text-sm text-red-600">{{ error }}</p>
    {% endif %}
    {% if image_url %}
      <img src="{{ image_url }}" alt="プロフィール画像" class="mb-4 h-24 w-24 rounded-full object-cover">
    {% endif %}
    <form method="post" action="{{ url_for('profile_image_preview') }}" class="flex gap-2">
      <input type="url" name="url" placeholder="http://example.com/avatar.png" class="input-field" required>
      <button type="submit" class="btn-solid whitespace-nowrap">登録</button>
    </form>
  </div>
{% endblock %}
