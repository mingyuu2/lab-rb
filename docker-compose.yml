services:
  ec-site:
    build: ./ec-site
    ports:
      - "80:80"
    networks:
      - external-net
      - internal-net
    depends_on:
      - proxy-server

  proxy-server:
    build: ./proxy-server
    cap_add:
      - NET_ADMIN
    ports:
      - "22:22"
    networks:
      internal-net:
        aliases:
          - proxy-server.internal

networks:
  external-net:
    driver: bridge
  internal-net:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.28.99.0/24
