# Intentionally loose forward-proxy config for a security training lab.
# No destination IP/port restriction (reproduces "egress not limited to
# 80/443" misconfiguration) and the default Via header is kept intact.
http_port 3128
http_access allow all
via on
visible_hostname proxy-server.internal
forwarded_for on
access_log /var/log/squid/access.log squid
coredump_dir /var/cache/squid
